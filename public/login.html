<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CDSO Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <div class="left">
        <h1>CDSO</h1>
        <p>City Disaster and Safety Office</p>
    </div>

    <div class="right">

        <form class="login-form" action="/auth/login" method="POST">

            <h2>Login</h2>

            <input
                type="email"
                name="email"
                placeholder="example@cca.edu.ph"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

            <br><br>

            <a href="/signup.html">
                Create Account
            </a>

        </form>

    </div>

</div>

</body>
</html>
