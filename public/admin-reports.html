<!DOCTYPE html>
<html>
<head>
    <title>Admin Reports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="logo">
    <div class="sidebar-logo-box">
        <img src="/images/cca-logo.png" alt="CCA Logo">
    </div>
    <h1>MAIN ADMIN</h1>
</div>

        <ul>
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="admin-approvals.html">Approvals</a></li>
            <li><a href="admin-reports.html">Reports</a></li>
            <li><a href="system-config.html">System Config</a></li>
            <li><a href="/auth/logout">Logout</a></li>
        </ul>
    </div>

    <div class="main">
        <h1>REPORT MANAGEMENT</h1>

        <div class="cards">
            <div class="card">
                <h3>Total Reports</h3>
                <p id="totalReports">0</p>
            </div>

            <div class="card">
                <h3>Live Status</h3>
                <p>ACTIVE</p>
            </div>
        </div>

        <div class="table-box">
            <h2>Realtime Reports</h2>

            <table width="100%" cellpadding="15">
                <tr>
                    <th>Name</th>
                    <th>Problem Type</th>
                    <th>Description</th>
                    <th>File</th>
                    <th>Status</th>
                </tr>

                <tbody id="reportTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
