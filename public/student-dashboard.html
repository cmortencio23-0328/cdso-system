<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="sidebar">

        <div class="logo">
            <div class="sidebar-logo-box">
                <img src="/images/cca-logo.png" alt="CCA Logo">
            </div>

            <h1>STUDENT</h1>
        </div>

        <ul>
            <li><a href="student-dashboard.html">Dashboard</a></li>
            <li><a href="student-reports.html">Submit Report</a></li>
            <li><a href="/auth/logout">Logout</a></li>
        </ul>

    </div>

    <div class="main">

        <h1>STUDENT DASHBOARD</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Reports</h3>
                <p id="totalReports">0</p>
            </div>

            <div class="card">
                <h3>Report Monitoring</h3>
                <p>ACTIVE</p>
            </div>

        </div>

        <div class="table-box">
            <h2>Previous / Ongoing Reports</h2>

            <table width="100%" cellpadding="15">
                <tr>
                    <th>Name</th>
                    <th>Problem Type</th>
                    <th>Description</th>
                    <th>File</th>
                    <th>Status</th>
                </tr>

                <tbody id="reportTable"></tbody>
            </table>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
