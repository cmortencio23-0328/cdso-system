<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <div class="left">
        <h1>CDSO</h1>
        <p>Campus Development and Services Office</p>
        
        <p>Sign Up</p>
    </div>

    <div class="right">

        <form
            class="login-form"
            action="/auth/signup"
            method="POST"
        >

            <h2>Create Account</h2>

            <input
                type="text"
                name="fullname"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="example@cca.edu.ph"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

            <br><br>

            <a href="/login.html">
                Back to Login
            </a>

        </form>

    </div>

</div>

</body>
</html>
